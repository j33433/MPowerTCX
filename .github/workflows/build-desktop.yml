name: Build Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: linux
            artifact: upload.bike-linux.AppImage
            glob: target/release/bundle/appimage/*.AppImage
          - platform: windows-latest
            target: windows
            artifact: upload.bike-windows.msi
            glob: target/release/bundle/msi/*.msi
          - platform: macos-14
            target: macos-arm64
            artifact: upload.bike-macos-arm64.dmg
            glob: target/release/bundle/dmg/*.dmg
          - platform: macos-13
            target: macos-x64
            artifact: upload.bike-macos-x64.dmg
            glob: target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'MPowerTCX -> target'

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev pkg-config

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build WASM
        run: wasm-pack build crates/mpowertcx-wasm --target web --out-dir ../../web/pkg

      - name: Build desktop app
        run: cargo tauri build

      - name: Rename artifact
        shell: bash
        run: |
          found=$(ls ${{ matrix.glob }} 2>/dev/null | head -1)
          if [ -z "$found" ]; then
            echo "No file matching ${{ matrix.glob }}"
            exit 1
          fi
          cp "$found" "${{ matrix.artifact }}"
          ls -lh "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: List installers
        run: ls -lh installers/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installers/upload.bike-linux.AppImage
            installers/upload.bike-windows.msi
            installers/upload.bike-macos-arm64.dmg
            installers/upload.bike-macos-x64.dmg
