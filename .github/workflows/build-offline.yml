name: Build Offline Zip

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build offline zip
        run: python3 scripts/build-offline.py

      - name: Verify
        run: ls -lh web/downloads/upload.bike-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: upload.bike-portable.zip
          path: web/downloads/upload.bike-portable.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: upload.bike-portable.zip
          path: .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: upload.bike-portable.zip
